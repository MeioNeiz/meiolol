<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>meiolol training</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root {
  color-scheme: light;
  --plane: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --s5: #e87ba4;
  --s6: #008300;
  --s7: #6250d6;
  --s8: #e34948;
  --good: #0ca30c;
  --warning: #fab219;
  --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --plane: #0d0d0d;
    --surface: #1a1a19;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --s4: #c98500;
    --s5: #d55181;
    --s7: #9085e9;
    --s8: #e66767;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--plane);
  color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));
}
main { max-width: 1100px; margin: 0 auto; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 16px 0 8px; }
h1 { font-size: 20px; margin: 0; }
h2 { font-size: 17px; margin: 0; overflow-wrap: anywhere; }
h3 { font-size: 14px; margin: 0 0 4px; color: var(--ink-2); font-weight: 600; }
a { color: var(--s1); }
.muted { color: var(--muted); font-size: 13px; }
.stale { color: var(--critical); font-weight: 600; }
.layout { display: grid; grid-template-columns: minmax(240px, 320px) 1fr; gap: 16px; align-items: start; }
@media (max-width: 760px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.layout > * { min-width: 0; }
.runs { display: flex; flex-direction: column; gap: 6px; }
.run {
  all: unset; display: block; cursor: pointer; padding: 10px 12px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--border);
}
.run:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.run[aria-current="true"] { border-color: var(--s1); box-shadow: inset 0 0 0 1px var(--s1); }
.run .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.run .name { font-weight: 600; overflow-wrap: anywhere; }
.run .last { color: var(--ink-2); font-size: 13px; overflow-wrap: anywhere; }
.pill { white-space: nowrap; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.pill::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; background: var(--muted); }
.pill.running::before { background: var(--s1); animation: pulse 1.6s ease-in-out infinite; }
.pill.paused::before { background: var(--warning); }
.pill.done::before { background: var(--good); }
.pill.failed::before, .pill.died::before { background: var(--critical); }
@keyframes pulse { 50% { opacity: 0.3; } }
@media (prefers-reduced-motion: reduce) { .pill.running::before { animation: none; } }
.detail { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; min-width: 0; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 6px 0 12px; font-size: 13px; color: var(--ink-2); }
.facts code { overflow-wrap: anywhere; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px; }
figure { margin: 0; position: relative; }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 2px 14px; margin: 0 0 4px; padding: 0; font-size: 13px; color: var(--ink-2); }
.key { display: inline-block; width: 14px; height: 2px; border-radius: 1px; vertical-align: middle; margin-right: 6px; }
svg { display: block; width: 100%; touch-action: pan-y; }
svg text { fill: var(--muted); font-size: 11px; }
svg .grid { stroke: var(--grid); stroke-width: 1; }
svg .base { stroke: var(--axis); stroke-width: 1; }
svg .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg .cross { stroke: var(--muted); stroke-width: 1; }
svg .dot { stroke: var(--surface); stroke-width: 2; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
  white-space: nowrap; z-index: 2;
}
.tip .x { color: var(--muted); margin-bottom: 2px; }
.tip b { color: var(--ink); font-variant-numeric: tabular-nums; margin-right: 6px; }
.tip span { color: var(--ink-2); }
details { margin-top: 12px; }
summary { cursor: pointer; color: var(--ink-2); font-size: 14px; }
pre {
  background: var(--plane); border: 1px solid var(--border); border-radius: 8px; padding: 10px;
  overflow: auto; max-height: 420px; font-size: 12px; margin: 8px 0 0;
}
table { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 8px; }
th, td { padding: 3px 10px 3px 0; text-align: right; }
th { color: var(--ink-2); font-weight: 600; }
.table-wrap { overflow-x: auto; }
.empty { padding: 24px 0; color: var(--ink-2); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Training</h1>
    <span id="age" class="muted"></span>
    <span class="muted"><a href="../">Box and daily eval</a></span>
  </header>
  <div class="layout">
    <nav class="runs" id="runs" aria-label="Runs"></nav>
    <section class="detail" id="detail" aria-live="polite"></section>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
