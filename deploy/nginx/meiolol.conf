# meiolol on C01 (repo deploy/vm-web.sh installs it as /etc/nginx/conf.d/meiolol.conf):
# the static site (uploaded by the web loop, user meiolol, rrsync only), behind the
# Cloudflare Tunnel (cloudflared to 127.0.0.1:8080; TLS at Cloudflare)
# /api/: meiolol-api.service on 127.0.0.1:8090 (repo docs/your-games.md)
limit_req_zone $binary_remote_addr zone=meiolol_api:1m rate=60r/m;
# Own access log, no IP addresses (repo deploy/traffic.sh aggregates it for /admin/ops/)
log_format meiolol_noip escape=json '{"t":$msec,"s":$status,"m":"$request_method","u":"$uri","b":$body_bytes_sent,"rt":$request_time,"c":"$upstream_cache_status","r":"$http_referer","a":"$http_user_agent"}';
# deploy/cache-warm.sh (the box, after each data version) requests every page: not a visit
map $http_user_agent $meiolol_logged {
    meiolol-cache-warm 0;
    default 1;
}
# Pages the static build leaves out, rendered by meiolol-render on this host (repo
# docs/hosting.md "Rendering on request")
# Version of the data the renderer serves, in the cache key: the box sends it after each
# swap or reload (repo deploy/cache-version.sh; /usr/local/bin/meiolol-cache-version
# writes it), so new data shows at once and older copies are never read again
include /etc/nginx/meiolol-version.conf;
# deploy/cache-warm.sh (the box only, X-Meiolol-Warm: 1) refreshes each page's copy under
# "<uri>|any", whatever the version, for @render_any to serve when the box can't answer
# and the current version has no copy: a deploy storm changes the version every few
# minutes, faster than a warm-up run
geo $meiolol_from_box {
    default 0;
    127.0.0.1 1;
}
map "$meiolol_from_box:$http_x_meiolol_warm" $meiolol_warm {
    "1:1" 1;
    default "";
}
map $meiolol_warm $meiolol_key_version {
    1 any;
    default $meiolol_version;
}
# Hashed assets (repo src/site/assets.zig: style.1a2b3c4d.css), champion portraits and
# item and spell art (src/icons.zig: a folder per Data Dragon version) never change under
# their name, so browsers keep them a year without asking again; runes (no version in
# the path) a week; everything else revalidates
map $uri $meiolol_cache_control {
    "~^/[A-Za-z0-9_-]+\.[0-9a-f]{8}\.(css|js|wasm|woff2)$" "public, max-age=31536000, immutable";
    "~^/icon/[0-9.]+/(120/)?[A-Za-z0-9]+\.jpg$" "public, max-age=31536000, immutable";
    "~^/dd/[0-9.]+/img/(item|spell)/(40/)?[A-Za-z0-9_]+\.jpg$" "public, max-age=31536000, immutable";
    "~^/dd/img/perk-images/[A-Za-z0-9_/]+\.png$" "public, max-age=604800";
    default "no-cache";
}
# The notes tool (repo src/site/notes.zig, docs/arch-site.md "Notes"): a page request with
# its marker cookie (set at an admin's login) takes a hop through @notes, which adds the
# tool's tag; any other request is served as before, so visitors' pages carry none of it.
# Hashed assets and other files skip the hop and keep their cache headers
map $http_cookie $meiolol_notes_cookie {
    "~(^|;\s*)__Host-meiolol_notes=1(;|$)" 1;
    default "";
}
# The /private and /admin hop (@notes_private) keeps the cookies for their auth_request,
# so its inner request says so to skip a second hop: sent by a visitor, it only drops
# their own tool
map "$meiolol_notes_cookie:$http_x_meiolol_notes_hop:$uri" $meiolol_notes {
    "~^1::.*\.(css|js|wasm|woff2|jpg|jpeg|png|svg|webp|ico|json|txt|xml|bin|gz|zip|exe)$" "";
    # The notes list, which runs the tool's wasm itself
    "~^1::/admin/notes$" "";
    "~^1::" 1;
    default "";
}
# Clean URLs (repo docs/plan/urls.md): which data a page shows is its query; each view's
# pages and data sit in an internal tree (repo src/site/html.zig View.dir). Other query
# keys (the pool's ?champs=) are state: neither the tree nor the cache key sees them
map "$arg_region:$arg_period" $meiolol_view {
    "all:patch" /_v/all-patch;
    "all:" /_v/all;
    ":patch" /_v/patch;
    default "";
}
proxy_cache_path /var/cache/nginx/meiolol keys_zone=meiolol_render:10m levels=1:2
    max_size=2g inactive=30d use_temp_path=off;
# Listed twice so a connection dropped as one renderer instance hands over to the next
# (deploy/render-swap.sh) is tried again; never marked down
upstream meiolol_render {
    server 192.168.18.71:8091 max_fails=0;
    server 192.168.18.71:8091 max_fails=0;
}

# meio.lol is the site's address; the old one and www redirect (308 keeps POSTs to /api/)
server {
    listen 127.0.0.1:8080;
    server_name meiolol.jomify.lol www.meio.lol;
    return 308 https://meio.lol$request_uri;
}

server {
    listen 127.0.0.1:8080 default_server;
    server_name meio.lol vm.meio.lol;
    # Every request comes from cloudflared on 127.0.0.1: the visitor's address for
    # limit_req, and for $meiolol_from_box, which only deploy/cache-warm.sh's direct
    # requests (no such header) then match
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    root /var/www/meiolol;
    # Locations as sent (/x), not rebuilt from this listener's host and port
    absolute_redirect off;
    gzip_static on;
    charset utf-8;
    access_log /var/log/nginx/meiolol.access.log meiolol_noip if=$meiolol_logged;
    include /etc/nginx/meiolol-headers.conf;
    # Revalidate every load (ETag, 304 when unchanged): a new upload shows at once; hashed
    # assets a year (map above)
    location / {
        # error_page with a bare = keeps @notes' own status (404s, redirects)
        error_page 418 = @notes;
        if ($meiolol_notes) {
            return 418;
        }
        # No trailing slash: /champions/ is /champions
        rewrite ^/(.+)/$ /$1 permanent;
        add_header Cache-Control $meiolol_cache_control;
        include /etc/nginx/meiolol-headers.conf;
        # A page in the query's view tree, else at the root (champion and shared pages,
        # files); the rest renders on request, which reads the query the same way
        try_files $meiolol_view$uri.html $uri $uri.html @render;
    }

    # Data Dragon's item, spell and rune art (repo src/icons.zig, ui.art.local) and its
    # small copy (40/ beside it, srcset): ours once a web round made it, else Data Dragon's
    # own, uncached so ours shows once made
    location ~ ^/dd/(?<meiolol_dd_dir>[A-Za-z0-9_./-]+?/)(?:40/)?(?<meiolol_dd_file>[A-Za-z0-9_]+)\.(?:jpg|png)$ {
        add_header Cache-Control $meiolol_cache_control;
        include /etc/nginx/meiolol-headers.conf;
        try_files $uri @ddragon;
    }
    # A portrait's big copy (src/icons.zig) not made yet: its small one, uncached so the
    # big one shows once made
    location ~ ^/icon/(?<meiolol_iv>[0-9.]+)/120/(?<meiolol_ik>[A-Za-z0-9]+)\.jpg$ {
        add_header Cache-Control $meiolol_cache_control;
        include /etc/nginx/meiolol-headers.conf;
        try_files $uri @icon_small;
    }
    location @icon_small {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/meiolol-headers.conf;
        rewrite ^ /icon/$meiolol_iv/$meiolol_ik.jpg break;
    }
    location @ddragon {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/meiolol-headers.conf;
        return 302 https://ddragon.leagueoflegends.com/cdn/$meiolol_dd_dir$meiolol_dd_file.png;
    }

    # The home renders on request (none on disk), so it has a cached copy and a warm-up
    # copy for outages like any page. Its file is never a URL (/index.html redirects)
    location = / {
        error_page 418 = @notes;
        if ($meiolol_notes) {
            return 418;
        }
        # A second hop for @render's own fallback to @render_any
        recursive_error_pages on;
        error_page 404 = @render;
        return 404;
    }

    # The same request again through this server, without cookies (so no second hop) and
    # without gzip or validators (so sub_filter sees the whole HTML, and a copy cached
    # before the login can't come back as a 304 without the tool). Only the inner request
    # is logged: one line per view, its visitor address from CF-Connecting-IP
    location @notes {
        access_log off;
        proxy_pass http://127.0.0.1:$server_port;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        proxy_intercept_errors off;
        sub_filter '</body>' '<link rel="stylesheet" href="/private/notes.css"><script src="/private/notes.js" data-wasm="/private/notes.wasm" defer></script></body>';
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "private, no-store" always;
        gzip on;
        gzip_proxied any;
    }

    # As @notes for the logged-in pages: the cookies stay, so the inner request runs its
    # location's auth_request (a login's 302 and a 403 come back as they are)
    location @notes_private {
        access_log off;
        proxy_pass http://127.0.0.1:$server_port;
        proxy_set_header Host $host;
        proxy_set_header X-Meiolol-Notes-Hop 1;
        proxy_set_header Accept-Encoding "";
        proxy_set_header If-None-Match "";
        proxy_set_header If-Modified-Since "";
        proxy_intercept_errors off;
        sub_filter '</body>' '<link rel="stylesheet" href="/private/notes.css"><script src="/private/notes.js" data-wasm="/private/notes.wasm" defer></script></body>';
        proxy_hide_header Cache-Control;
        proxy_hide_header ETag;
        proxy_hide_header Last-Modified;
        add_header Cache-Control "private, no-store" always;
        gzip on;
        gzip_proxied any;
    }

    # Cached 10 min, keyed by the data version (above); while the box is down or
    # restarting, the last copy. X-Meiolol-Render: HIT, MISS, STALE, UPDATING
    location @render {
        proxy_pass http://meiolol_render;
        # One cached copy per page: always ask the box for gzip, unzip for the rare
        # client that cannot take it, and Vary ignored (else a copy per client
        # Accept-Encoding, so deploy/cache-warm.sh's would serve only some browsers)
        proxy_set_header Accept-Encoding gzip;
        gunzip on;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        # Public requests never carry the admin token (see /admin/api/)
        proxy_set_header X-Meiolol-Admin "";
        proxy_set_header X-Meiolol-Role "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_cache meiolol_render;
        proxy_cache_key "$meiolol_view$uri|$meiolol_key_version";
        proxy_cache_bypass $meiolol_warm;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        # The renderer says no-cache to everything: nginx decides
        proxy_hide_header Cache-Control;
        add_header Cache-Control $meiolol_cache_control;
        include /etc/nginx/meiolol-headers.conf;
        add_header X-Meiolol-Render $upstream_cache_status always;
        # The box's own 503 (loading) too, when there is no copy under this version
        proxy_intercept_errors on;
        recursive_error_pages on;
        error_page 502 503 504 = @render_any;
    }

    # The page's warm-up copy from any version; nothing listens on port 9, so only the
    # cache answers
    location @render_any {
        proxy_pass http://127.0.0.1:9;
        proxy_connect_timeout 1s;
        proxy_cache meiolol_render;
        proxy_cache_key "$meiolol_view$uri|any";
        proxy_cache_use_stale error timeout;
        gunzip on;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $meiolol_cache_control;
        include /etc/nginx/meiolol-headers.conf;
        add_header X-Meiolol-Render "ANY-$upstream_cache_status" always;
        error_page 502 504 = @render_down;
    }

    location @render_down {
        default_type text/plain;
        add_header Retry-After 60 always;
        include /etc/nginx/meiolol-headers.conf;
        return 503 "This page is being updated. Try again in a minute.\n";
    }

    # Logins (repo src/api/accounts.zig, docs/plan/accounts.md): meiolol-api answers
    # /auth/; bodies hold passwords, never logged
    location /auth/ {
        limit_req zone=meiolol_api burst=30 nodelay;
        access_log off;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        client_max_body_size 4k;
    }

    # auth_request for /admin/: 204 with X-Meiolol-Role when the session cookie's role has
    # view_admin; 401 without a login (sent to the login page), 403 for a lower role
    location = /_meiolol_admin {
        internal;
        access_log off;
        proxy_pass http://127.0.0.1:8090/auth/check/view_admin;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location @meiolol_login {
        return 302 /login?next=$uri;
    }

    # Private ops page (meiolol admin, uploaded every 15 min by the box web loop; repo
    # src/admin.zig), for a login with view_admin. Pages without .html, as the public ones
    location = /admin {
        error_page 418 = @notes_private;
        if ($meiolol_notes) {
            return 418;
        }
        auth_request /_meiolol_admin;
        error_page 401 = @meiolol_login;
        add_header Cache-Control "no-cache";
        include /etc/nginx/meiolol-headers.conf;
        try_files /admin/index.html =404;
    }
    location /admin/ {
        error_page 418 = @notes_private;
        if ($meiolol_notes) {
            return 418;
        }
        auth_request /_meiolol_admin;
        error_page 401 = @meiolol_login;
        rewrite ^/(.+)/$ /$1 permanent;
        add_header Cache-Control "no-cache";
        include /etc/nginx/meiolol-headers.conf;
        try_files $uri $uri.html =404;
    }

    # Private site (repo docs/hosting.md "Private site"): logins with view_private (the
    # private role and up); the box uploads private/ only while this gate answers 302
    location = /_meiolol_private {
        internal;
        access_log off;
        proxy_pass http://127.0.0.1:8090/auth/check/view_private;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    # The desktop app's files and its own update check (docs/plan/app.md "Two editions";
    # repo deploy/web-loop.sh desktop_files, src/desktop/update.zig): the app's device
    # token or update.key, which opens this directory only, or a login with
    # download_private_app. .gz copies beside the files
    location /private/desktop/ {
        auth_request /_meiolol_desktop_key;
        add_header Cache-Control "no-cache";
        include /etc/nginx/meiolol-headers.conf;
        add_header X-Robots-Tag "noindex" always;
        try_files $uri =404;
    }
    location = /private {
        error_page 418 = @notes_private;
        if ($meiolol_notes) {
            return 418;
        }
        auth_request /_meiolol_private;
        error_page 401 = @meiolol_login;
        add_header Cache-Control "no-cache";
        include /etc/nginx/meiolol-headers.conf;
        add_header X-Robots-Tag "noindex" always;
        try_files /private/index.html =404;
    }
    location /private/ {
        error_page 418 = @notes_private;
        if ($meiolol_notes) {
            return 418;
        }
        auth_request /_meiolol_private;
        error_page 401 = @meiolol_login;
        rewrite ^/(.+)/$ /$1 permanent;
        add_header Cache-Control "no-cache";
        include /etc/nginx/meiolol-headers.conf;
        add_header X-Robots-Tag "noindex" always;
        try_files $uri $uri.html =404;
    }
    # Training runs from the Mac (repo deploy/lab-push.sh, received by
    # deploy/training-receive.sh): outside the box uploads, which --delete admin/
    location /admin/training/ {
        alias /var/www/meiolol-training/current/;
        auth_request /_meiolol_admin;
        add_header Cache-Control "no-cache";
        include /etc/nginx/meiolol-headers.conf;
        gzip on;
        gzip_vary on;
        gzip_types application/json text/plain;
    }

    # Live admin data and controls: meiolol render on the box answers /admin/api/ only with
    # this token (meiolol-admin-token.conf, root only; box: ml/meiolol/admin.token), and
    # runs actions only for X-Meiolol-Role with run_actions (the owner)
    location /admin/api/ {
        auth_request /_meiolol_admin;
        auth_request_set $meiolol_role $upstream_http_x_meiolol_role;
        proxy_set_header X-Meiolol-Role $meiolol_role;
        access_log off;
        proxy_pass http://meiolol_render;
        proxy_set_header Host $host;
        include /etc/nginx/meiolol-admin-token.conf;
        gzip on;
        gzip_proxied any;
        gzip_types application/json text/plain application/octet-stream;
        proxy_connect_timeout 2s;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/meiolol-headers.conf;
    }

    # Site traffic for the admin page (repo deploy/traffic.sh, every 5 min)
    location /admin/ops/ {
        alias /var/www/meiolol-ops/;
        auth_request /_meiolol_admin;
        access_log off;
        add_header Cache-Control "no-cache";
        include /etc/nginx/meiolol-headers.conf;
    }

    location = /_meiolol_desktop_key {
        internal;
        access_log off;
        # 204 when X-Meiolol-Desktop holds the key (root only), else the login's answer
        include /etc/nginx/meiolol-desktop-key.conf;
        proxy_pass http://127.0.0.1:8090/auth/check/download_private_app;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # Notes on the live site (repo src/api/notes.zig): take_notes logins only, checked by
    # meiolol-api. Never cached here or at Cloudflare
    location /api/notes {
        limit_req zone=meiolol_api burst=30 nodelay;
        access_log off;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
    }

    # Open without login since 2026-10-17 (Jacob: Riot reviewers must be able to run
    # it). The query string holds Riot IDs: no access log
    location /api/ {
        limit_req zone=meiolol_api burst=30 nodelay;
        access_log off;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
        client_max_body_size 1k;
    }
}
