# Security headers on every meio.lol response, installed as /etc/nginx/meiolol-headers.conf
# (deploy/vm-web.sh). meiolol.conf includes it in the server and in each location with its
# own add_header, which drops the server's; not in @notes, whose inner request has them.
# Scripts, styles and Trusted Types: each page's CSP meta (src/site/csp.zig)
add_header X-Frame-Options DENY always;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Staged: 5 min, then a day, then a year with includeSubDomains (docs/hosting.md)
add_header Strict-Transport-Security "max-age=86400" always;
