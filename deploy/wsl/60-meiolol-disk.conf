# The gpu-box's WSL, /etc/sysctl.d (deploy/gpu-box.sh install; docs/compute.md "Disk
# resets"). The default 20% of 24 GB let a writer pile up ~4.6 GB unwritten, flushed to
# the DRAM-less Crucial P3 in bursts it stalls on; at 512 MB writers wait at its pace
vm.dirty_background_bytes = 134217728
vm.dirty_bytes = 536870912
