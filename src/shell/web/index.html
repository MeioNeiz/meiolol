<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>meiolol</title>
<!-- Placeholder until the app's screens are site components (docs/plan/ui/stack.md
     Order step 6): shows that the shell's channel works -->
<style>
  html { background: #08090a; color: #d8dade; font: 13px/1.4 system-ui, sans-serif; }
  body { margin: 0; display: grid; place-items: center; min-height: 100vh; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { margin: 0; color: #8a8f98; }
</style>
</head>
<body>
<main>
  <h1>meiolol</h1>
  <p id="status">Waiting for the League client</p>
</main>
<script>
  const words = { none: 'Waiting for the League client', no_data: 'No statistics yet', idle: 'In the client',
    champ_select: 'Champ select', in_game: 'In game', post_game: 'After the game' };
  addEventListener('meiolol', (e) => {
    const s = e.detail.status;
    if (s) document.getElementById('status').textContent = words[s.client] || '';
  });
</script>
</body>
</html>
