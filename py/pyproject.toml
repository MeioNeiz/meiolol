# Lab Python on the gpu-box only (deploy/lab-run.sh --python): cross-checks of Zig models.
# One shared env per uv.lock hash, ~/ml/pyenv/HASH
[project]
name = "meiolol-lab-py"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.11.0",
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "lightgbm",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
